name: 🤖 LinkedIn Autonomy Demo

on:
  workflow_dispatch:

jobs:
  linkedin_demo:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install selenium webdriver-manager pyyaml pypdf validate_email openai requests

      - name: 🚀 Run AI LinkedIn Auto-Apply
        env:
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
        run: |
          python auto_apply_main.py
