name: 🤖 AI Job Hunter V7 — Auto-Postulación 24/7

on:
  workflow_dispatch:       # Ejecución manual desde GitHub

jobs:
  job_hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: |
        pip install -r requirements.txt

    - name: 📁 Prepare directories
      run: mkdir -p data reportes cover_letters

    - name: 📄 Reconstruct CV PDF
      run: |
        if [ -n "$CV_PDF_B64" ]; then
          echo "$CV_PDF_B64" | base64 -d > data/CV_Erick_Flores_EN.pdf
          echo "✓ CV restaurado ($(wc -c < data/CV_Erick_Flores_EN.pdf) bytes)"
        else
          echo "⚠️ CV_PDF_B64 no configurado"
        fi
      env:
        CV_PDF_B64: ${{ secrets.CV_PDF_B64 }}

    - name: 🚀 Run AI Job Hunter V7
      env:
        TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        CV_PATH:              data/CV_Erick_Flores_EN.pdf
        MAX_APPLICATIONS:     "5"
        AUTO_APPLY:           "true"
        EMAIL_SENDER:         ${{ secrets.EMAIL_USER }}
        EMAIL_USER:           ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
        SMTP_HOST:            smtp.gmail.com
        SMTP_PORT:            "587"
        SMTP_TLS:             "true"
        OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
        HUNTER_API_KEY:       ${{ secrets.HUNTER_API_KEY }}
        LINKEDIN_LI_AT:       ${{ secrets.LINKEDIN_LI_AT }}
        LINKEDIN_JSESSIONID:  ${{ secrets.LINKEDIN_JSESSIONID }}
        PROFILE_PHONE:        "+593963951193"
      run: |
        echo "🚀 AI Job Hunter V7 — $(date +'%Y-%m-%d %H:%M UTC')"
        python main_v6.py
        echo "✅ Ciclo completado."

    - name: 📊 Commit resultados
      run: |
        git config --global user.name "AI Job Hunter Bot 🤖"
        git config --global user.email "bot@job-hunter.ai"
        git add cover_letters/ reportes/ data/applied_jobs.json 2>/dev/null || true
        git commit -m "🎯 Auto-Apply V7: $(date +'%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
        git push || echo "Push fallido"
