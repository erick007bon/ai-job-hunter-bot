name: 🤖 AI Job Hunter V7 — Auto-Postulación 24/7

on:
  workflow_dispatch:       # Ejecución manual desde GitHub
  schedule:
    - cron: '0 13,18,23 * * *' # 3 veces al día (08:00, 13:00 y 18:00 hora Ecuador)

jobs:
  job_hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: |
        pip install -r requirements.txt

    - name: 📁 Prepare directories
      run: mkdir -p data reportes cover_letters

    - name: 📄 Verify CV PDFs
      run: |
        ls -la data/*.pdf || true
        if [ -f "data/CV_Erick_Flores_Data_AI.pdf" ]; then
          echo "✓ CV Data/AI verificado"
        fi
        if [ -f "data/CV_Erick_Flores_Pasantias.pdf" ]; then
          echo "✓ CV Pasantías verificado"
        fi
      env:
        CV_PDF_B64: ${{ secrets.CV_PDF_B64 }}

    - name: 🚀 Run AI Job Hunter V7
      env:
        TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        CV_PATH:              data/CV_Erick_Flores_Data_AI.pdf
        MAX_APPLICATIONS:     "15"
        AUTO_APPLY:           "false"
        EMAIL_SENDER:         ${{ secrets.EMAIL_SENDER || 'erickflores6655@gmail.com' }}
        EMAIL_USER:           ${{ secrets.EMAIL_USER || 'erickflores6655@gmail.com' }}
        EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
        SMTP_HOST:            smtp.gmail.com
        SMTP_PORT:            "587"
        SMTP_TLS:             "true"
        GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
        OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
        HUNTER_API_KEY:       ${{ secrets.HUNTER_API_KEY }}
        LINKEDIN_LI_AT:       ${{ secrets.LINKEDIN_LI_AT }}
        LINKEDIN_JSESSIONID:  ${{ secrets.LINKEDIN_JSESSIONID }}
        PROFILE_PHONE:        "+593963951193"
      run: |
        echo "🚀 AI Job Hunter V7 — $(date +'%Y-%m-%d %H:%M UTC')"
        python main_v6.py
        echo "✅ Ciclo completado."

    - name: 📊 Commit resultados
      run: |
        git config --global user.name "AI Job Hunter Bot 🤖"
        git config --global user.email "bot@job-hunter.ai"
        git add cover_letters/ reportes/ data/applied_jobs.json 2>/dev/null || true
        git commit -m "🎯 Auto-Apply V7: $(date +'%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
        git push || echo "Push fallido"
